<header class="site-header" id="top">
  <div class="container header__inner">
    <!-- Text-based Tharwa logo that returns users to the top of the page. -->
    <a
      class="brand"
      href="#top"
      aria-label="Tharwa home"
      (click)="closeMenu()"
    >
      THARWA<span class="brand__dot" aria-hidden="true">.</span>
    </a>

    <!-- Accessible mobile navigation toggle. -->
    <button
      class="menu-toggle"
      [class.menu-toggle--open]="isMenuOpen()"
      type="button"
      aria-controls="primary-navigation"
      [attr.aria-expanded]="isMenuOpen()"
      (click)="toggleMenu()"
    >
      <span class="visually-hidden">
        {{ isMenuOpen() ? 'Close navigation menu' : 'Open navigation menu' }}
      </span>

      <!-- Decorative lines form the menu and close icons. -->
      <span class="menu-toggle__line" aria-hidden="true"></span>
      <span class="menu-toggle__line" aria-hidden="true"></span>
    </button>

    <!-- Section links provide single-page navigation. -->
    <nav
      class="navigation"
      [class.navigation--open]="isMenuOpen()"
      id="primary-navigation"
      aria-label="Primary navigation"
    >
      <a class="navigation__link" href="#about" (click)="closeMenu()">
        About
      </a>

      <a class="navigation__link" href="#services" (click)="closeMenu()">
        Services
      </a>

      <a class="navigation__link" href="#impact" (click)="closeMenu()">
        Impact
      </a>

      <a class="navigation__link" href="#how-it-works" (click)="closeMenu()">
        How it works
      </a>

      <a
        class="button button--primary navigation__action"
        href="#contact"
        (click)="closeMenu()"
      >
        Contact us
      </a>
    </nav>
  </div>
</header>
