<div
  class="ecosystem"
  role="img"
  aria-label="Tharwa connects digital payments, money transfers, merchant solutions, bill payments, digital wallets, and payment gateways."
>
  <!-- The circular path represents money moving through one ecosystem. -->
  <div class="ecosystem__orbit" aria-hidden="true"></div>

  <!-- Tharwa is positioned at the centre of all six services. -->
  <div class="ecosystem__core" aria-hidden="true">
    <span>T</span>
    <span class="ecosystem__core-dot"></span>
  </div>

  <!-- Angular creates one visual node for every service in the static data. -->
  @for (service of services; track service.id; let index = $index) {
    <div
      class="ecosystem__service"
      [attr.data-service]="service.id"
      [attr.data-tone]="service.tone"
      [style.animation-delay.ms]="index * -650"
      aria-hidden="true"
    >
      @switch (service.icon) {
        @case ('payment') {
          <svg viewBox="0 0 24 24">
            <rect x="3" y="5" width="18" height="14" rx="2"></rect>
            <path d="M3 10h18"></path>
            <path d="M7 15h4"></path>
          </svg>
        }

        @case ('transfer') {
          <svg viewBox="0 0 24 24">
            <path d="M4 8h14"></path>
            <path d="m15 5 3 3-3 3"></path>
            <path d="M20 16H6"></path>
            <path d="m9 13-3 3 3 3"></path>
          </svg>
        }

        @case ('merchant') {
          <svg viewBox="0 0 24 24">
            <path d="M4 10v10h16V10"></path>
            <path d="M3 10 5 4h14l2 6"></path>
            <path d="M8 20v-6h4v6"></path>
            <path d="M3 10c1 2 3 2 4 0 1 2 3 2 5 0 1 2 3 2 5 0 1 2 3 2 4 0"></path>
          </svg>
        }

        @case ('bill') {
          <svg viewBox="0 0 24 24">
            <path d="M6 3h9l3 3v15H6z"></path>
            <path d="M14 3v4h4"></path>
            <path d="M9 12h6"></path>
            <path d="M9 16h6"></path>
          </svg>
        }

        @case ('wallet') {
          <svg viewBox="0 0 24 24">
            <path d="M4 7h15a2 2 0 0 1 2 2v10H4a2 2 0 0 1-2-2V7z"></path>
            <path d="M4 7 17 4v3"></path>
            <path d="M16 12h5v4h-5a2 2 0 0 1 0-4z"></path>
          </svg>
        }

        @case ('gateway') {
          <svg viewBox="0 0 24 24">
            <rect x="6" y="2" width="12" height="20" rx="2"></rect>
            <path d="M9 6h6"></path>
            <path d="M9 10h6"></path>
            <path d="M10 18h4"></path>
          </svg>
        }
      }

      <span class="visually-hidden">{{ service.title }}</span>
    </div>
  }
</div>
